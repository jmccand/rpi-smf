[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-smf"
version = "0.1.0"
description = "Factor-tilted strategy benchmarked to the Nasdaq-100 (adapted from IPS_FSPTX.pdf)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "yfinance",
    "cvxpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rpi-smf = "rpi_smf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
