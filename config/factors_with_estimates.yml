# Fixed factor set (IPS 4.1). `function` names a registered function in
# rpi_smf/factors.py; `expected_sign` is the IPS-stated direction.
# `needs` names the estimates-export columns the factor reads (see data/fundamentals.py).
factors:
  - name: forward_earnings_yield
    function: forward_earnings_yield
    expected_sign: 1
    needs: [ntm_eps]
  - name: revenue_growth_forecast
    function: revenue_growth_forecast
    expected_sign: 1
    needs: [ntm_revenue_growth]
  - name: eps_growth_forecast
    function: eps_growth_forecast
    expected_sign: 1
    needs: [ntm_eps_growth]
  - name: momentum
    function: momentum
    expected_sign: 1
    params: {lookback_months: 12, skip_months: 1}
  - name: estimate_revisions
    function: estimate_revisions
    expected_sign: 1
    needs: [ntm_eps]
    params: {months: 3}
  - name: volatility
    function: volatility
    expected_sign: -1
    params: {window_days: 252}
