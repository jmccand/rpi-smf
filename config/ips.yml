# IPS parameters. Per IPS Section 10, change only through a dated amendment
# (append to `amendments` with date, rationale, approver).
ips_version: 1
amendments:
  - date: 2026-10-10
    change: "Factor set (IPS 4.1) reduced to price-only factors: market_beta (CAPM, vs SPY), momentum, volatility. Forward earnings yield, revenue/EPS growth forecasts and estimate revisions dropped."
    rationale: "Point-in-time analyst estimates could not be sourced (no history for the 24-month regression)."
    approver: "pending"
  - date: 2026-10-10
    change: "Benchmark changed from FSPTX to the Nasdaq-100 (QQQ prices; constituents/GICS from NQ100.xlsx; weights = market-cap proxy). Universe is all 100 constituents, not only technology."
    rationale: "Course/team decision to run the strategy against the Nasdaq-100."
    approver: "pending"
  - date: 2026-10-18
    change: "Benchmark return series changed from QQQ to QQQM (same Nasdaq-100 index; lower expense ratio, 0.15% vs 0.20%). Constituents/weights unchanged."
    rationale: "Team preference; QQQM is the cheaper share class of the same index."
    approver: "pending"


run:
  start_date: 2026-09-28        # inception; configurable
  initial_capital: 1000000      # USD
  benchmark: QQQM               # Nasdaq-100 proxy (total-return ETF prices); was FSPTX, then QQQ
  initial_weights: benchmark    # start from the benchmark's own (market-cap proxy) weights

allocation:
  technology: {min: 1.00, max: 1.00}   # algo sleeve out of scope; sleeve is the whole portfolio (IPS range is 0.70-1.00)

model:
  zscore_cap: 3.0
  regression_window_months: 24
  ma_months: 18               # N
  phi: 0.5                    # blend of moving average vs factor estimate
  market_proxy: SPY           # CAPM market for the beta factor (not set by IPS)
  min_cross_section: 20       # min stocks with returns for a monthly regression

optimizer:
  cov_window_days: 252
  cov_shrinkage: 0.10         # diagonal shrinkage intensity (not set by IPS)
  trading_days: 252
  months_per_year: 12
  tau: 0.0015                 # 15 bp per unit of turnover
  vol_ratio_target: 1.00      # lambda calibrated to this x benchmark trailing vol
  vol_ratio_max: 1.10
  te_max: 0.06
  single_name_cap: 0.08       # applied to sleeve weight (sleeve is 100% of portfolio)
  gics_cap: 0.40
  gics_level: sub_industry    # column of gics.csv used for the cap
  min_history_days: 252       # names with less price history are excluded

trading:
  threshold: 0.015            # trade only if |current - target| > 1.5pp
  execution: close            # simulated fill at rebalance-date close
  cost_bps: 15                # charged on simulated turnover

compliance:
  min_positions: 30
  min_position_weight: 0.001  # weights below this do not count as a position

performance:
  risk_free: DTB3             # FRED series; falls back to ^IRX
  trading_days: 252
  sharpe_window: 63
  var_horizon: 10
