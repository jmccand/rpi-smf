# FactSet Estimates API (v2 rolling consensus) settings. Credentials are NOT here:
# pass the Developer Portal app-config JSON via --factset-config or $FACTSET_CONFIG.
region_suffix: "-US"        # FactSet ticker-region ids, e.g. NVDA-US
currency: USD
frequency: W                # perspective-date frequency: D, W, AM, AQ, AY
batch_size: 50              # ids per request
metrics: {eps: EPS, sales: SALES}
# Relative period / periodicity used for next- and last-twelve-month consensus.
# UNVERIFIED against a live account: confirm with `rpi-smf pull-factset --probe`.
ntm: {periodicity: NTMA, relative_period: 1}
ltm: {periodicity: LTMA, relative_period: 0}
